<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClubPortalAI Private Lessons Prototype</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--fg:#1f2933;--muted:#667085;--line:#e4e4e1;--brand:#f16432;--brand2:#d94f20;--soft:#fff8f5;--good:#067647;--goodbg:#ecfdf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.bar{background:#fff7f2;border-bottom:1px solid #ffd7c7;color:#b54708;padding:8px;text-align:center;font-size:12px;font-weight:800}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 33px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px}.brand{font-weight:900;font-size:18px;padding:8px 8px 24px}.brand span{display:inline-grid;place-items:center;width:34px;height:30px;background:var(--brand);color:#fff;border-radius:4px;margin-right:8px;font-size:12px}.navlabel{font-size:10px;color:#98a2b3;text-transform:uppercase;letter-spacing:.12em;padding:14px 8px 6px}.nav{padding:10px 9px;border-radius:7px;color:#475467;margin:2px 0}.nav.active{background:#f7f1ed;box-shadow:inset 3px 0 0 var(--brand);font-weight:800}.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:800}.page{max-width:1450px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.head h1{font-size:30px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted)}.btn{border:1px solid #d9d9d6;background:#fff;border-radius:9px;padding:9px 13px;font-weight:800;color:#344054}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.title{font-size:17px;font-weight:900}.tiny{font-size:11px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.badge.good{background:var(--goodbg);color:var(--good)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.steps{display:flex;margin-bottom:22px}.step{flex:1;text-align:center;font-size:11px;font-weight:800;color:#98a2b3;border-top:2px solid #e4e7ec;padding-top:9px}.step.active,.step.done{color:var(--brand);border-color:var(--brand)}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900}.input{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px;background:#fff}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.choice{border:1px solid #d9d9d6;border-radius:12px;padding:14px;background:#fff}.choice.selected{border-color:var(--brand);background:var(--soft)}.availability{display:grid;gap:9px}.avail-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.avail-row:last-child{border-bottom:0}.court-buttons{display:flex;gap:7px;flex-wrap:wrap}.location{border:1px solid #d9d9d6;border-radius:12px;padding:14px}.location.active{border-color:var(--brand);background:var(--soft)}.actions{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.notice{border:1px solid #ffd7c7;background:#fff8f5;border-radius:12px;padding:12px 14px;color:#8f3d1f;font-size:12px}
@media(max-width:850px){.app{display:block}.side{display:none}.cards,.two,.three{grid-template-columns:1fr}.page{padding:18px 14px}.avail-row{grid-template-columns:1fr}}
</style>
</head>
<body><div class="bar">PROTOTYPE ONLY · Synthetic data · Private Lesson rules are still being discovered</div><div id="app"></div>
<script>
var state={screen:"list",step:1,draft:{title:"",description:"",coach:"Megan Lee",duration:60,locations:{"WPVC South Gym":["Court 1"],"WPVC North Gym":[]},availability:[{day:"Mon",start:"16:00",end:"20:00"},{day:"Wed",start:"16:00",end:"20:00"}],ach:75,card:79,cancelHours:24}};
var offerings=[
{title:"Serve & Attack",coach:"Megan Lee",duration:60,price:"$75",bookings:12,status:"Active"},
{title:"Setter Development",coach:"Aaron Blake",duration:45,price:"$60",bookings:8,status:"Active"},
{title:"Defense & Libero",coach:"Megan Lee",duration:60,price:"$75",bookings:5,status:"Draft"}
];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shell(content){return '<div class="app"><aside class="side"><div class="brand"><span>CP</span>ClubPortalAI</div><div class="navlabel">Training</div><div class="nav active">Private Lessons</div><div class="navlabel">Operations</div><div class="nav">Events</div><div class="nav">Attendance</div><div class="navlabel">Season Planning</div><div class="nav">Tryouts</div></aside><div class="main"><div class="top"><div>Winter Park Volleyball Academy</div><div class="tiny">Staff/Admin · CA</div></div>'+content+'</div></div>'}
function render(){document.getElementById("app").innerHTML=shell(state.screen==="list"?listView():createView())}
function listView(){return '<main class="page"><div class="head"><div><h1>Private Lessons</h1><div class="sub">Lesson offerings families can book with club Coaches.</div></div><button class="btn primary" onclick="startCreate()">+ Create Lesson Offering</button></div><div class="notice" style="margin-bottom:16px"><b>Prototype assumption:</b> this list represents reusable lesson offerings. Individual bookings become scheduled Sessions later.</div><div class="grid cards">'+offerings.map(o=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="title">'+esc(o.title)+'</div><div class="tiny">'+esc(o.coach)+'</div></div><span class="badge '+(o.status==="Active"?"good":"")+'">'+o.status+'</span></div><div style="margin-top:14px"><div class="row"><span class="tiny">Duration</span><b>'+o.duration+' min</b></div><div class="row"><span class="tiny">Price</span><b>'+o.price+'</b></div><div class="row"><span class="tiny">Upcoming bookings</span><b>'+o.bookings+'</b></div></div><div style="margin-top:14px;text-align:right"><button class="btn small">Open</button></div></div>').join("")+'</div></main>'}
function startCreate(){state.screen="create";state.step=1;render()}
function createView(){var labels=["Basics","Availability","Pricing","Review"];return '<main class="page"><div class="head"><div><h1>Create Lesson Offering</h1><div class="sub">Define what families can book.</div></div><button class="btn" onclick="state.screen=\'list\';render()">Exit setup</button></div><div class="form"><div class="steps">'+labels.map((l,i)=>'<div class="step '+(state.step===i+1?"active":state.step>i+1?"done":"")+'">'+l+'</div>').join("")+'</div>'+stepBody()+'<div class="actions"><button class="btn" '+(state.step===1?'style="visibility:hidden"':'')+' onclick="state.step--;render()">Back</button>'+(state.step<4?'<button class="btn primary" onclick="state.step++;render()">Continue</button>':'<button class="btn primary" onclick="publish()">Publish Offering</button>')+'</div></div></main>'}
function stepBody(){if(state.step===1)return basics();if(state.step===2)return availability();if(state.step===3)return pricing();return review()}
function basics(){var d=state.draft;return '<div class="grid" style="gap:20px"><div class="field"><label>Lesson name</label><input class="input" style="font-size:16px" placeholder="Serve & Attack" value="'+esc(d.title)+'" oninput="state.draft.title=this.value"></div><div class="field"><label>Parent description</label><textarea class="input" rows="3" placeholder="What will the Player work on?" oninput="state.draft.description=this.value">'+esc(d.description)+'</textarea></div><div class="grid two"><div class="field"><label>Coach</label><select class="input" onchange="state.draft.coach=this.value"><option>Megan Lee</option><option>Aaron Blake</option><option>Jordan Kim</option></select></div><div class="field"><label>Lesson length</label><select class="input" onchange="state.draft.duration=Number(this.value)"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option></select></div></div></div>'}
function availability(){var d=state.draft;return '<div class="grid two"><div class="card"><div class="title">Coach availability</div><div class="sub">Families can request times inside these windows.</div><div class="availability" style="margin-top:10px">'+d.availability.map((a,i)=>'<div class="avail-row"><b>'+a.day+'</b><div>'+a.start+' – '+a.end+'</div><button class="btn small">Edit</button></div>').join("")+'</div><button class="btn small" style="margin-top:10px">+ Add availability</button></div><div class="card"><div class="title">Locations & courts</div><div class="sub">Choose where this Coach can teach this lesson.</div>'+Object.keys(d.locations).map(loc=>'<div class="location '+(d.locations[loc].length?"active":"")+'" style="margin-top:10px"><b>'+loc+'</b><div class="court-buttons" style="margin-top:8px">'+courts(loc).map(c=>'<button class="btn small '+(d.locations[loc].includes(c)?"primary":"")+'" onclick="toggleCourt(\''+loc+'\',\''+c+'\')">'+c+'</button>').join("")+'</div></div>').join("")+'</div></div>'}
function pricing(){var d=state.draft;return '<div class="grid two"><div class="card"><div class="title">Price per lesson</div><div class="grid two" style="margin-top:10px"><div class="field"><label>ACH</label><input class="input" type="number" value="'+d.ach+'"></div><div class="field"><label>Card</label><input class="input" type="number" value="'+d.card+'"></div></div></div><div class="card"><div class="title">Cancellation</div><div class="field" style="margin-top:10px"><label>Cancel without penalty until</label><div style="display:flex;gap:8px;align-items:center"><input class="input" style="width:100px" type="number" value="'+d.cancelHours+'"><span class="tiny">hours before lesson</span></div></div></div></div>'}
function review(){var d=state.draft;return '<div class="grid two"><div class="card"><div class="title">Lesson</div><div class="row"><span>Coach</span><b>'+esc(d.coach)+'</b></div><div class="row"><span>Length</span><b>'+d.duration+' min</b></div><div class="row"><span>Availability windows</span><b>'+d.availability.length+'</b></div></div><div class="card"><div class="title">Booking</div><div class="row"><span>ACH price</span><b>$'+d.ach+'</b></div><div class="row"><span>Card price</span><b>$'+d.card+'</b></div><div class="row"><span>Cancellation</span><b>'+d.cancelHours+' hours</b></div></div></div>'}
function courts(loc){return loc==="WPVC South Gym"?["Court 1","Court 2","Court 3","Court 4"]:["Court A","Court B","Court C"]}
function toggleCourt(loc,c){var a=state.draft.locations[loc],i=a.indexOf(c);if(i>=0)a.splice(i,1);else a.push(c);render()}
function publish(){offerings.unshift({title:state.draft.title||"New Lesson",coach:state.draft.coach,duration:state.draft.duration,price:"$"+state.draft.ach,bookings:0,status:"Active"});state.screen="list";state.step=1;render()}
render();
</script></body></html>
