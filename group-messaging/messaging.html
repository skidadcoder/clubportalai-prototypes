function observeVisible(){if(observer)observer.disconnect();readTimers.forEach(clearTimeout);readTimers=[];const root=$('#stream');if(!root)return;const currentUser=user,currentGroup=selected;const viewing=el=>{if(user!==currentUser||selected!==currentGroup||!el.isConnected||$('#dialog').open||$('#review-controls').open||$('#send-options')?.open||document.visibilityState!=='visible'||!document.hasFocus())return false;const r=el.getBoundingClientRect(),b=root.getBoundingClientRect();const visible=Math.max(0,Math.min(r.bottom,b.bottom,innerHeight)-Math.max(r.top,b.top,0));return visible>=Math.min(r.height,b.height)*.65};observer=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting||!viewing(e.target))continue;const id=Number(e.target.closest('[data-message]').dataset.message),version=msg(id).version;readTimers.push(setTimeout(()=>{if(!viewing(e.target))return;const m=msg(id),g=group(m.g);if(!member(g)||!allowed(m)||m.version!==version||m.removed)return;if((m.reads?.[user]||0)>=m.version)return;m.reads={...m.reads,[user]:m.version};m.readEvidence=m.readEvidence||{};m.readEvidence[m.version]={...(m.readEvidence[m.version]||{}),[user]:true};const label=$('#read-'+m.id);if(label)label.textContent='Viewed';updateHeader();const row=$('[data-group="'+g.id+'"]');if(row){const temp=document.createElement('div');temp.innerHTML=groupRow(g);row.replaceWith(temp.firstElementChild);$('[data-group="'+g.id+'"]').onclick=()=>{selected=g.id;searchOpen=false;search='';annOnly=false;mobileOpen=true;render();focusUnread()}}},750))}},{root,threshold:[0,.65,1]});$$('[data-message] .message-body').forEach(el=>observer.observe(el))}

function reportDialog(m,tab='reads',version=m.version){if(!isStaff()||!(member(group(m.g))||isMod()))return;const g=group(m.g);const original=m.recipients||g.members;const names=original.filter(id=>version===m.version?(m.reads[id]||0)>=version:Boolean(m.readEvidence?.[version]?.[id]));const later=Object.keys(m.readEvidence?.[version]||{}).filter(id=>!original.includes(id)&&m.readEvidence[version][id]);modal('Reads & alerts',`<div><strong>${esc(g.name)}</strong><p class="tiny muted">${esc(m.time)} · ${m.ann?'Announcement':'Chat'}${m.edited?' · Edited':''}</p></div><div class="report-tab">${m.ann?`<button id="tab-reads" aria-pressed="${tab==='reads'}">Announcement reads</button>`:''}<button id="tab-alerts" aria-pressed="${tab==='alerts'||!m.ann}">Alert outcomes</button></div>${tab==='reads'&&m.ann?`<div class="flex between wrap"><label class="tiny">Version <select id="receipt-version">${Array.from({length:m.version},(_,i)=>`<option value="${i+1}" ${version===i+1?'selected':''}>${i+1}${i+1===m.version?' · latest':''}</option>`).join('')}</select></label><span class="tiny muted">Viewed when displayed on screen</span></div><div class="metrics"><div class="metric"><strong>${names.length} / ${original.length}</strong><span>Original recipients viewed</span></div><div class="metric"><strong>${later.length}</strong><span>Later readers · separate</span></div></div><div><h3>Original publication recipients</h3><p class="tiny muted">This list stays fixed after edits and membership changes.</p><div class="table-scroll"><table><thead><tr><th>Name</th><th>Version ${version}</th></tr></thead><tbody>${original.map(id=>`<tr><td>${esc(people[id].name)}</td><td>${names.includes(id)?'<span class="pill green">Viewed</span>':'<span class="pill">Not viewed</span>'}</td></tr>`).join('')}</tbody></table></div></div><div><h3>Later readers</h3>${later.length?later.map(id=>`<p class="tiny muted">${esc(people[id].name)} · viewed version ${version}</p>`).join(''):'<p class="tiny muted">None for thi function shellIcon(name){const paths={briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12a24 24 0 0 0 18 0M12 11v4"/>',whistle:'<circle cx="8" cy="15" r="5"/><path d="M8 10h5l3-4h5v7l-8 3M6 15h4M18 2v1M23 5h-1"/>',jersey:'<path d="m8 3-6 4 3 5 3-2v11h8V10l3 2 3-5-6-4a4 4 0 0 1-8 0Z"/><path d="M10 13h4M12 11v6"/>',people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M16 3a4 4 0 0 1 0 8"/>',message:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9H13a8.5 8.5 0 0 1 8 8v.5Z"/><path d="M8 9h8M8 13h5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>',shield:'<path d="M12 3 3 7v6c0 5 9 9 9 9s9-4 9-9V7Z"/>',layers:'<path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 16l10 5 10-5"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8M8 17h8"/>',trophy:'<path d="M8 21h8M12 17v4M7 3h10v5a5 5 0 0 1-10 0ZM7 5H3v3a4 4 0 0 0 4 4M17 5h4v3a4 4 0 0 1-4 4"/>',panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.5 2.5 0 1 1 4.4 1.6c-1.2.8-1.9 1.1-1.9 2.9M12 17h.01"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',user:'<circle cx="12" cy="7" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/>',chevron:'<path d="m6 9 6 6 6-6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};return `<svg class="shell-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.file}</svg>`}
function updateMessagesHeight(){const app=$('#app');if(app?.classList.contains('messaging-active'))document.documentElement.style.setProperty('--messages-top',Math.max(0,app.getBoundingClientRect().top)+'px');if($('#review-current'))$('#review-current').textContent=people[user].name+' · synthetic'}
function stashComposeDraft(){const form=$('#compose');if(!form)return;composeDrafts[form.dataset.draftKey]={text:$('#chat-text').value,ann:Boolean($('#send-ann')?.checked),email:Boolean($('#send-email')?.checked),sms:Boolean($('#send-sms')?.checked),sender:($('#send-as')?.checked?'club':'self')||'self'}}
function openSearchTools(){searchOpen=true;$('.messages-page').classList.add('searching');$('#search').focus()}
function bindReadingLayout(){if($('#portal-home-back'))$('#portal-home-back').onclick=()=>{screen='home';render()};if($('#group-new'))$('#group-new').onclick=createGroupDialog;if($('#group-search'))$('#group-search').onclick=openSearchTools;if($('#close-search'))$('#close-search').onclick=()=>{searchOpen=false;search='';annOnly=false;groupFilter='all';audienceFilter='all';render();if(selected)focusUnread()};
 const form=$('#compose');if(!form)return;const draft=composeDrafts[form.dataset.draftKey];if(draft){$('#chat-text').value=draft.text;if($('#send-as'))$('#send-as').checked=draft.sender==='club';for(const [key,id] of [['ann','send-ann'],['email','send-email'],['sms','send-sms']])if($('#'+id))$('#'+id).checked=draft[key]}
 const resize=()=>{const t=$('#chat-text');t.style.height='42px';t.style.height=Math.min(120,Math.max(42,t.scrollHeight+2))+'px'};$('#chat-text').oninput=resize;resize();
 const summary=()=>{const club=Boolean($('#send-as')?.checked),ann=Boolean($('#send-ann')?.checked),email=Boolean($('#send-email')?.checked),sms=Boolean($('#send-sms')?.checked);$('#send-selection').textContent=club||ann||email||sms?(club?'Sending as WPVC Admin · ':'')+(ann?'Announcement':'Chat')+' · '+([email?'Email':null,sms?'SMS':null].filter(Boolean).join(' + ')||'Portal only'):''};
 for(const id of ['send-as','send-ann','send-email','send-sms'])if($('#'+id))$('#'+id).onchange=summary;summary();if($('#done-send-options'))$('#done-send-options').onclick=()=>{$('#send-options').open=false;$('#send-options summary').focus()};if($('#send-options'))$('#send-options').ontoggle=()=>observeVisible();
}
window.addEventListener('resize',updateMessagesHeight);
$('#review-controls').ontoggle=()=>observeVisible();
document.addEventListener('click',e=>{const review=$('#review-controls');if(review.open&&!review.contains(e.target))review.open=false;const options=$('#send-options');if(options?.open&&!options.contains(e.target))options.open=false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#review-controls').open){$('#review-controls').open=false;$('#review-controls summary').focus()}if($('#send-options')?.open){$('#send-options').open=false;$('#send-options summary').focus()}}});
for(const id of ['persona','scenario']){const prior=$('#'+id).onchange;$('#'+id).onchange=e=>{$('#review-controls').open=false;searchOpen=false;prior(e);updateMessagesHeight()}}
$('#guide').addEventListener('click',()=>{$('#review-controls').open=false},true);
const priorReset=$('#reset').onclick;$('#reset').onclick=()=>{if($('#send-as'))$('#send-as').checked=false;if($('#chat-text'))$('#chat-text').value='';for(const id of ['send-ann','send-email','send-sms'])if($('#'+id))$('#'+id).checked=false;for(const key of Object.keys(composeDrafts))delete composeDrafts[key];searchOpen=false;$('#review-controls').open=false;priorReset();updateMessagesHeight()};
let lastChromeUser='';
function closeShellNavigation(){document.body.classList.remove('nav-open');$('#shell-mobile-toggle')?.setAttribute('aria-expanded','false');syncShellNavigation()}
function renderStaffChrome(){const staff=usesWorkShell();document.body.classList.toggle('staff-mode',staff);if(!staff){closeShellNavigation();return}if(lastChromeUser===user&&$('#shell-sidebar'))return;lastChromeUser=user;
 const navRow=(label,icon)=>`<span class="shell-nav-row" aria-disabled="true" title="Existing app page · shown for context in this prototype">${shellIcon(icon)}<span class="shell-label">${label}</span></span>`;
 $('#staff-chrome').innerHTML=`<button class="shell-scrim" id="shell-scrim" aria-label="Close navigation"></button><aside class="shell-sidebar" id="shell-sidebar" aria-label="${isCoach()?'Coach':'Staff/Admin'} navigation"><div class="shell-brand-row"><div class="shell-wordmark" aria-label="Winter Park Volleyball Club"><strong>WPVC</strong><small>WINTER PARK VOLLEYBALL CLUB</small></div><button class="shell-icon-btn" id="shell-collapse" aria-label="Collapse navigation">${shellIcon('panel')}</button></div><nav class="shell-nav">${isCoach()?'<div class="shell-nav-heading">Coach Workspace</div>'+navRow('Dashboard','layers')+navRow('Teams','people')+navRow('Rosters','file')+navRow('Tryouts','calendar')+navRow('Schedule','calendar'):'<div class="shell-nav-heading">Operations</div>'+navRow('Accounts','people')+navRow('Players','people')+navRow('Coaches','people')+navRow('Events','calendar')}<button class="shell-nav-row" id="shell-messages" aria-current="page" title="Messages · proposed navigation placement">${shellIcon('message')}<span class="shell-label">Messages</span><span class="shell-menu-proposed">Proposed</span></button>${isCoach()?'':'<div class="shell-nav-heading">Staff</div>'+navRow('Staff','people')+''+navRow('Roles & Permissions','shield')+'<div class="shell-nav-heading">Season Planning</div>'+navRow('Seasons','trophy')+''+navRow('Teams','layers')+''+navRow('Rosters','file')+''+navRow('Tournaments','calendar')+''+navRow('Tryouts','calendar')+''+navRow('Season Tuition Plans','file')+''+navRow('Waivers & Legal Docs','file')+'<div class="shell-nav-heading">Season Readiness</div>'+navRow('Enrollment Follow-Up','file')+''+navRow('Uniform Fittings','file')+''}</nav><div class="shell-footer"><button class="shell-user" id="shell-profile" aria-label="User menu"><span class="shell-user-avatar">${initials(user)}</span><span class="shell-user-copy"><strong>${esc(people[user].name)}</strong><small>${isMod()?'Designated moderator':isCoach()?'Coach':'Staff'}</small></span></button><div class="shell-powered">Powered by <span class="shell-powered-symbol">∞</span><strong>Club Portal AI</strong></div></div></aside><header class="shell-topbar"><div class="flex"><button class="shell-icon-btn shell-mobile-menu" id="shell-mobile-toggle" aria-label="Open navigation menu" aria-controls="shell-sidebar" aria-expanded="false">${shellIcon('menu')}</button><span class="shell-top-title">${isCoach()?'COACH':'MANAGE'}</span><span class="shell-breadcrumb" aria-hidden="true">/</span><span class="shell-page-title">Messages</span></div><div class="shell-tools"><button class="shell-workspace" id="shell-workspace">${isCoach()?'Coach':'Staff/Admin'} ${shellIcon('chevron')}</button><button class="shell-help" id="shell-help" aria-label="Open messaging Help">${shellIcon('help')}<span>Help</span></button><span class="shell-context-icon" title="Existing app theme control · outside this prototype">${shellIcon('sun')}</span><span class="shell-context-icon" title="Existing app notifications · outside this prototype">${shellIcon('bell')}</span><button class="shell-icon-btn" id="shell-user-menu" aria-label="User menu">${shellIcon('user')}</button></div></header>`;
 $('#shell-messages').onclick=()=>{closeShellNavigation();screen='messages';selected=null;search='';annOnly=false;groupFilter='all';audienceFilter='all';mobileOpen=false;render()};
 $('#shell-collapse').onclick=()=>{if(matchMedia('(max-width:800px)').matches){closeShellNavigation();$('#shell-mobile-toggle').focus()}else{document.body.classList.toggle('nav-collapsed');$('#shell-collapse').setAttribute('aria-label',document.body.classList.contains('nav-collapsed')?'Expand navigation':'Collapse navigation')}};
 $('#shell-mobile-toggle').onclick=()=>{const open=document.body.classList.toggle('nav-open');$('#shell-mobile-toggle').setAttribute('aria-expanded',String(open));syncShellNavigation();if(open)$('#shell-collapse').focus()};$('#shell-scrim').onclick=()=>{closeShellNavigation();$('#shell-mobile-toggle').focus()};
 $('#shell-help').onclick=()=>{if(isCoach()){modal('Messages Help','<div class="stack"><h3>Your conversations</h3><p class="tiny muted">Read announcements, search authorized history, and chat with your groups. You can edit or remove your own messages while posting is allowed.</p><h3>Custom groups</h3><p class="tiny muted">Create a custom group with contacts from your Teams and Team Programs plus club Staff. Invitees join after accepting. Manage membership in groups you created while you remain a member, or leave a custom group.</p><h3>Moderator access</h3><p class="tiny muted">Designated Staff moderators may review messaging groups. Coach access does not grant moderator or Staff-only publishing features.</p></div>');return}modal('Messages Help',`<div class="stack"><h3>Chat and announcements</h3><p class="tiny muted">Choose a group to read or post. Staff can mark a message as an announcement and independently select Email, SMS, both, or neither.</p><h3>Correct information</h3><p class="tiny muted">Use Edit to update your own message. Publish correction creates a new announcement and labels the earlier one Superseded.</p><h3>Review outcomes</h3><p class="tiny muted">Reads & alerts shows announcement views and separate channel outcomes. Provider acceptance is not proof of delivery.</p><h3>Moderator access</h3><p class="tiny muted">Designated moderators can review all messaging groups and audit history. Posting still requires membership. Private Billing remains separate.</p></div>`)};
 const profile=()=>modal('User menu',`<div class="member-row"><span class="shell-user-avatar">${initials(user)}</span><div><strong>${esc(people[user].name)}</strong><small>${isCoach()?'Coach':'Staff'}${isMod()?' · designated moderator':''}</small></div></div><p class="tiny muted">Synthetic review identity. Use the prototype’s View as control to explore the other journeys.</p>`);$('#shell-profile').onclick=profile;$('#shell-user-menu').onclick=profile;
 $('#shell-workspace').onclick=()=>modal('Current workspace',`<div class="shell-workspace-menu"><div class="notice"><strong>${isCoach()?'Coach':'Staff/Admin'}</strong><br>Messages uses the existing ${isCoach()?'Coach':'staff'} workspace.${isMod()?' Designated moderator access applies within this workspace.':''}</div><p class="tiny muted">Prototype context: the navigation reproduces the existing app shell. Only the Messages destination is interactive here. Other app pages and workspace permissions are outside this prototype.</p></div>`);
}
function syncShellNavigation(){const side=$('#shell-sidebar');if(side)side.inert=matchMedia('(max-width:800px)').matches&&!document.body.classList.contains('nav-open')}
function updateShellOffset(){document.documentElement.style.setProperty('--review-height',$('.prototype').getBoundingClientRect().height+'px');syncShellNavigation();updateMessagesHeight()}
window.addEventListener('resize',syncShellNavigation);
new ResizeObserver(updateShellOffset).observe($('.prototype'));updateShellOffset();
document.addEventListener('keydown',e=>{if(!usesWorkShell()||!document.body.classList.contains('nav-open')||$('#dialog').open)return;if(e.key==='Escape'){closeShellNavigation();$('#shell-mobile-toggle').focus()}if(e.key==='Tab'){const controls=[...$('#shell-sidebar').querySelectorAll('button')];const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const startView=new URLSearchParams(location.search).get('view');if(['staff','moderator','coach'].includes(startView)){user=startView==='staff'?'avery':startView==='coach'?'jordan':'taylor';screen='messages';selected=startView==='moderator'?'two':'team';mobileOpen=true;$('#persona').value=user}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')observeVisible()});
render();if(['staff','moderator','coach'].includes(startView))focusUnread();
</script>
