    html='<div class="form"><div class="callout"><strong>Refunds preserve original payment history.</strong> Choose a settled payment and enter the amount to return.</div><label class="label">Payment<select id="fPayment">'+pays.map((p,i)=>'<option value="'+i+'">'+fmt(p.date)+' · '+p.desc+' · '+money(Math.abs(p.amount))+'</option>').join('')+'</select></label><label class="label">Refund amount<input id="fAmount" type="number" min="0" step=".01" value="'+(pays[0]?Math.min(100,Math.abs(pays[0].amount)):0)+'"></label><label class="label">Reason<textarea id="fNote" placeholder="Reason for refund"></textarea></label></div>';foot+='<button class="btn primary" id="saveDrawer">Create fake refund</button>';
  } else if(a==='adjust'){
    const selected=data.installments.find(x=>x.id===id)||data.installments.find(x=>x.status!=='Paid')||data.installments[0];
    html='<div class="form"><label class="label">Installment<select id="fInstallment">'+data.installments.map(x=>'<option value="'+x.id+'" '+(selected&&selected.id===x.id?'selected':'')+'>'+fmt(x.date)+' · '+x.label+'</option>').join('')+'</select></label><div class="formrow"><label class="label">Amount<input id="fAmount" type="number" step=".01" value="'+(selected?selected.amount:0)+'"></label><label class="label">Due date<input id="fDate" type="date" value="'+(selected?selected.date:today)+'"></label></div><label class="label">Adjustment note<textarea id="fNote" placeholder="Optional internal note"></textarea></label></div>';foot+='<button class="btn primary" id="saveDrawer">Save adjustment</button>';
  } else if(a==='method'){
    html='<div class="form"><div class="callout">This is fake data. Do not enter a real card or bank account.</div><label class="label">Method type<select id="fType"><option>Card</option><option>ACH</option></select></label><label class="label">Display label<input id="fLabel" value="Demo Visa"></label><label class="label">Last four digits<input id="fLast4" inputmode="numeric" maxlength="4" value="4242"></label></div>';foot+='<button class="btn primary" id="saveDrawer">Add fake method</button>';
  } else if(a==='note'){
    html='<div class="form"><label class="label">Internal note<textarea id="fNote" placeholder="Visible to staff only"></textarea></label></div>';foot+='<button class="btn primary" id="saveDrawer">Add note</button>';
  } else if(a==='statement'){
    html='<div class="form"><div class="callout"><strong>Statement preview</strong><br>'+data.name+'<br>'+data.id+'<br><br>Current balance: <b>'+money(data.balance)+'</b><br>Past due: <b>'+money(data.pastDue)+'</b><br><br>This prototype does not generate a real PDF.</div><label class="label">Statement range<select><option>All activity</option><option>Current season</option><option>Last 90 days</option></select></label></div>';foot+='<button class="btn primary" id="saveDrawer">Pretend to print</button>';
  } else if(a==='account'){
    html='<div class="form"><label class="label">Primary contact<input id="fName" value="'+data.name+'"></label><label class="label">Email<input id="fEmail" value="'+data.email+'"></label><label class="label">Phone<input id="fPhone" value="'+data.phone+'"></label><label class="label">City<input id="fCity" value="'+data.city+'"></label></div>';foot+='<button class="btn primary" id="saveDrawer">Save</button>';
  } else {
    const r=data.transactions[Number(id)]||data.transactions[0];html='<div class="form"><div class="callout"><strong>'+r.desc+'</strong><br>'+fmt(r.date)+' · '+r.player+'<br>'+r.detail+'<br><br>Amount: <b>'+money(Math.abs(r.amount))+'</b></div><div class="mini"><h4>Prototype next actions</h4><div class="line"><span>Open processor evidence</span><b>›</b></div><div class="line"><span>View related charge</span><b>›</b></div><div class="line"><span>Add account note</span><b>›</b></div></div></div>';
  }
  $('#drawerBody').innerHTML=html;$('#drawerFoot').innerHTML=foot;
  $('#cancelDrawer').onclick=closeDrawer;const save=$('#saveDrawer');if(save)save.onclick=saveAction;
}
function saveAction(){
  const a=action.type;
  if(a==='payment'){
    const amt=Math.max(0,Number($('#fAmount').value||0));if(!amt)return toast('Enter an amount');
    const player=$('#fPlayer').value,method=$('#fMethod').value;data.balance=Math.max(0,data.balance-amt);data.pastDue=Math.max(0,data.pastDue-amt);data.openItems=Math.max(0,data.openItems-(data.pastDue===0?1:0));data.transactions.unshift({date:today,type:'Payment',desc:'Staff recorded payment',detail:method,player,amount:-amt});if(data.pastDue===0&&data.status==='Participation hold')data.status='Active';toast('Fake payment recorded');
  }
  if(a==='charge'){
    const amt=Math.max(0,Number($('#fAmount').value||0)),player=$('#fPlayer').value,desc=$('#fDesc').value;data.balance+=amt;data.openItems++;data.charges.push({id:'c'+Date.now(),group:'Staff-added charges · '+player,label:desc,player,amount:amt,remaining:amt,status:'Open'});data.transactions.unshift({date:today,type:'Charge',desc,detail:'Staff-added charge',player,amount:amt});toast('Fake charge added');
  }
  if(a==='refund'){
    const amt=Math.max(0,Number($('#fAmount').value||0));if(!amt)return toast('Enter a refund amount');const player=data.players[0].name;data.balance+=amt;data.transactions.unshift({date:today,type:'Refund',desc:'Refund created',detail:($('#fNote').value||'Staff refund'),player,amount:amt});toast('Fake refund created');
  }
  if(a==='adjust'){
    const id=$('#fInstallment').value,x=data.installments.find(i=>i.id===id),amt=Math.max(0,Number($('#fAmount').value||0)),date=$('#fDate').value;if(x){const delta=amt-x.amount;x.amount=amt;x.date=date;if(x.status!=='Paid')data.balance=Math.max(0,data.balance+delta);toast('Installment adjusted')}}
  if(a==='method'){
    const type=$('#fType').value,label=$('#fLabel').value||'Demo method',last4=$('#fLast4').value||'0000';data.methods.push({id:'m'+Date.now(),type,label,last4,default:false,autopay:false});toast('Fake payment method added');
  }
  if(a==='note'){const text=$('#fNote').value.trim();if(text)data.notes.unshift({date:today,by:'Chris Wirth',text});toast('Note added')}
  if(a==='statement'){toast('Print simulated')}
  if(a==='account'){data.name=$('#fName').value;data.email=$('#fEmail').value;data.phone=$('#fPhone').value;data.city=$('#fCity').value;toast('Fake account details updated')}
  closeDrawer();render();
}
function setDefault(id){data.methods.forEach(m=>m.default=m.id===id);render();toast('Default payment method changed')}
function reconcile(){
  if(!data.processing)return;const amt=data.processing;data.processing=0;const p=data.transactions.find(x=>x.type==='Processing');if(p){p.type='Payment';p.desc='Card payment verified';p.detail='Authorize.Net · settled after reconciliation'}const i=data.installments.find(x=>x.status==='Processing');if(i)i.status='Paid';data.balance=Math.max(0,data.balance-amt);data.status='Active';data.notes.unshift({date:today,by:'System',text:'Authorize.Net confirmed the '+money(amt)+' payment. Billing activity and balance were repaired exactly once.'});render();toast('Processor result verified and account repaired')}
init();
</script>
</body>
</html>
