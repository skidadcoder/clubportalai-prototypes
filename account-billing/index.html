let scenario=localStorage.getItem('cp-billing-scenario')||'healthy';
let data=deep(fixtures[scenario]);
let selectedPlayerName=data.players[0].name;
let tab='Activity',action=null,filters={q:'',type:'All'};
const tabs=['Activity','Open Items','Payment Schedule','Payment Methods'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function badge(text,kind='info'){return '<span class="badge '+kind+'">'+text+'</span>'}
function statusKind(s){
  s=String(s||'').toLowerCase();
  if(s.includes('paid')||s.includes('active')||s.includes('scheduled')||s.includes('current'))return 'good';
  if(s.includes('past')||s.includes('hold')||s.includes('returned')||s.includes('failed'))return 'bad';
  if(s.includes('processing')||s.includes('review')||s.includes('requested'))return 'warn';
  return 'info';
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2400)}
function selectedPlayer(){return data.players.find(p=>p.name===selectedPlayerName)||data.players[0]}
function playerTransactions(){return data.transactions.filter(x=>x.player===selectedPlayer().name)}
function playerInstallments(){return data.installments.filter(x=>x.player===selectedPlayer().name)}
function playerCharges(){return data.charges.filter(x=>x.player===selectedPlayer().name)}
function openCharges(){return playerCharges().filter(x=>Number(x.remaining||0)>0&&x.status!=='Removed')}
function unpaidInstallments(){return playerInstallments().filter(x=>x.status!=='Paid').sort((a,b)=>a.date.localeCompare(b.date))}
function nextPlayerInstallment(){return unpaidInstallments()[0]||null}
function playerPastDue(){return selectedPlayer().name===data.players[0].name?Number(data.pastDue||0):0}
function playerProcessing(){return selectedPlayer().name===data.players[0].name?Number(data.processing||0):0}

function ensureMeta(){
  data.playerBalances=data.playerBalances||{};
  data.players.forEach(p=>{
    if(data.playerBalances[p.name]==null)data.playerBalances[p.name]=data.players.length===1?Number(data.balance||0):playerChargesFor(p.name).reduce((s,x)=>s+Number(x.remaining||0),0);
  });
  data.mailingAddress=data.mailingAddress||'1234 Example Ave, '+data.city;
  data.billingAddress=data.billingAddress||data.mailingAddress;
  data.familyAccess=data.familyAccess||[
    {name:data.name,email:data.email,status:'Accepted',role:'Primary account access'},
    {name:'Jamie '+data.name.split(' ').slice(-1)[0],email:'jamie.family@example.com',status:'Pending',role:'Player access'}
  ];
  data.autopayByPlayer=data.autopayByPlayer||{};
  data.players.forEach(p=>{
    if(!data.autopayByPlayer[p.name]){
      const m=data.methods.find(x=>x.autopay)||data.methods[0];
      if(m)data.autopayByPlayer[p.name]=m.id;
    }
  });
  data.notes=data.notes||[];
  data.notes.forEach(n=>{if(!n.scope)n.scope='Account';if(!n.status)n.status='Normal'});
  data.adjustRequests=data.adjustRequests||[];
}
function playerChargesFor(name){return data.charges.filter(x=>x.player===name)}
function playerBalance(){ensureMeta();return Number(data.playerBalances[selectedPlayer().name]||0)}
function setPlayerBalance(v){ensureMeta();data.playerBalances[selectedPlayer().name]=Math.max(0,Number(v||0))}
function addPlayerBalance(delta){setPlayerBalance(playerBalance()+Number(delta||0));data.balance=Math.max(0,Number(data.balance||0)+Number(delta||0))}
function switchPlayer(name){selectedPlayerName=name;filters={q:'',type:'All'};tab='Activity';render()}

function init(){
  ensureMeta();
  const s=$('#scenario');
  s.innerHTML=Object.entries(fixtures).map(([k,v])=>'<option value="'+k+'">'+v.label+'</option>').join('');
  s.value=scenario;
  s.onchange=e=>{
    scenario=e.target.value;localStorage.setItem('cp-billing-scenario',scenario);
    data=deep(fixtures[scenario]);selectedPlayerName=data.players[0].name;tab='Activity';filters={q:'',type:'All'};ensureMeta();render();
  };
  $('#reset').onclick=()=>{data=deep(fixtures[scenario]);selectedPlayerName=data.players[0].name;tab='Activity';filters={q:'',type:'All'};ensureMeta();render();toast('Fake account reset')};
  $('#closeDrawer').onclick=closeDrawer;
  $('#drawerBack').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDrawer()});
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav!=='Accounts')toast(b.dataset.nav+' is outside this account prototype')});
  $('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')toast('Global search is outside this prototype')});
  render();
}

function render(){
  ensureMeta();
  $('#crumbName').textContent=data.name;$('#accountName').textContent=data.name;
  $('#accountBadge').innerHTML=badge(data.status,statusKind(data.status));
  $('#contact').innerHTML='<span>☎ '+data.phone+'</span><span>✉ '+data.email+'</span><span>⌖ '+data.city+'</span>';
  const nc=$('#noteCount');if(nc)nc.textContent='('+data.notes.length+')';
  renderPlayerContext();renderKpis();renderTabs();renderMain();renderRail();
  $$('[data-action]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.action,b.dataset.id||''));
}
function renderPlayerContext(){
  const p=selectedPlayer(),due=playerPastDue(),processing=playerProcessing();
  const state=due?badge('Past due','bad'):processing?badge('Payment review','warn'):badge('Current','good');
  $('#playerContext').innerHTML=
    '<div class="circle">'+p.initials+'</div><div class="who"><small>Billing for</small><strong>'+p.name+'</strong><span>'+p.team+'</span></div>'+state+
    '<button class="btn small" data-action="playerWorkspace">Open Player Workspace</button>'+
    '<div class="spacer"></div>'+
    (data.players.length>1?'<div class="switcher"><label for="playerSwitcher">Switch player</label><select id="playerSwitcher">'+data.players.map(x=>'<option value="'+x.name+'" '+(x.name===p.name?'selected':'')+'>'+x.name+' · '+x.team+'</option>').join('')+'</select></div>':'<span class="muted tiny">Only player on this account</span>');
  const sw=$('#playerSwitcher');if(sw)sw.onchange=e=>switchPlayer(e.target.value);
  const open=$('#playerContext [data-action]');if(open)open.onclick=()=>openDrawer('playerWorkspace');
}
function renderKpis(){
  const next=nextPlayerInstallment(),due=playerPastDue(),items=openCharges();
  $('#kpis').innerHTML=[
    ['＄','Player Balance',money(playerBalance()),'<a href="#" data-gotab="Activity">View activity →</a>',''],
    ['◷','Past Due',money(due),due?'Needs attention':'No past due balance.',due?'attn':''],
    ['▣','Next Payment',next?money(next.amount):'—',next?'Due '+fmt(next.date):'Nothing scheduled',''],
    ['☷','Open Items',items.length,items.length===1?'1 billing item':items.length+' billing items','']
  ].map(x=>'<div class="kpi '+x[4]+'"><div class="kicon">'+x[0]+'</div><div><div class="klabel">'+x[1]+'</div><div class="kvalue">'+x[2]+'</div><div class="khelp">'+x[3]+'</div></div></div>').join('');
  $$('[data-gotab]').forEach(a=>a.onclick=e=>{e.preventDefault();tab=e.currentTarget.dataset.gotab;render()});
}
function renderTabs(){
  $('#tabs').innerHTML=tabs.map(t=>'<button class="tab '+(t===tab?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('');
  $$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
}
function attention(){
  const processing=playerProcessing(),due=playerPastDue(),p=selectedPlayer();
  if(processing)return '<div class="alert blue"><div>⟳</div><div class="grow"><strong>'+money(processing)+' payment is unresolved for '+p.name+'</strong><span>This amount stays protected from another collection until the processor result is known.</span></div><div class="context-actions"><button class="btn small" id="reconcile">Check Authorize.Net</button></div></div>';
  if(due)return '<div class="alert"><div>!</div><div class="grow"><strong>'+money(due)+' is past due for '+p.name+'</strong><span>Collect payment or send a payment request. A participation hold, if present, is managed separately and is not removed automatically.</span></div><div class="context-actions"><button class="btn small primary" data-action="payment">Record payment</button><button class="btn small" data-action="paymentRequest">Send payment request</button></div></div>';
  return '';
}
function renderMain(){
  const p=$('#mainPanel');
  if(tab==='Activity')p.innerHTML=renderActivity();
  if(tab==='Open Items')p.innerHTML=renderOpenItems();
  if(tab==='Payment Schedule')p.innerHTML=renderSchedule();
  if(tab==='Payment Methods')p.innerHTML=renderMethods();
  const r=$('#reconcile');if(r)r.onclick=reconcile;
  $$('[data-action]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.action,b.dataset.id||''));
  $$('[data-pay-target]').forEach(b=>b.onclick=()=>openDrawer('payment',b.dataset.payTarget));
  $$('[data-adjust-target]').forEach(b=>b.onclick=()=>openDrawer('adjustBilling',b.dataset.adjustTarget));
  $$('[data-waive-fee]').forEach(b=>b.onclick=()=>openDrawer('waiveFee',b.dataset.waiveFee));
  $$('[data-method-manage]').forEach(b=>b.onclick=()=>openDrawer('methodManage',b.dataset.methodManage));
}
function renderActivity(){
  const source=playerTransactions(),types=['All',...new Set(source.map(x=>x.type))];
  const rows=source.filter(r=>(filters.q===''||(r.desc+' '+r.detail).toLowerCase().includes(filters.q.toLowerCase()))&&(filters.type==='All'||r.type===filters.type));
  setTimeout(()=>{
    const q=$('#txq'),ty=$('#txtype');
    if(q)q.oninput=e=>{filters.q=e.target.value;renderMain()};
    if(ty)ty.onchange=e=>{filters.type=e.target.value;renderMain()};
  },0);
  return attention()+
    '<div class="card"><div class="cardhead"><h2>Activity · '+selectedPlayer().name+'</h2><span class="badge info">Player register</span><div class="spacer"></div><button class="btn small" data-action="statement">Statement</button></div>'+
    '<div class="activity-tools"><input class="field" id="txq" placeholder="Search this player’s activity…" value="'+filters.q+'"><select class="select" id="txtype">'+types.map(x=>'<option '+(filters.type===x?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="spacer"></div><span class="scope-note">Payments, returns, refunds, fees, credits, and charges</span></div>'+
    registerTable(rows)+'</div>';
}
function registerTable(rows){
  if(!rows.length)return '<div class="empty"><b>No activity for '+selectedPlayer().name+'</b>Nothing matches the current filters.</div>';
  return '<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead><tbody>'+
    rows.map(r=>{const idx=data.transactions.indexOf(r);return '<tr><td>'+fmt(r.date)+'</td><td>'+badge(r.type,statusKind(r.type))+'</td><td class="desc"><strong>'+r.desc+'</strong><small>'+r.detail+'</small></td><td class="num money '+(r.amount<0?'pos':(r.type==='Refund'||r.type==='Return')?'neg':'')+'">'+(r.amount<0?'-':'')+money(Math.abs(r.amount))+'</td><td><button class="rowaction" data-action="activityAction" data-id="'+idx+'" aria-label="Actions for '+r.desc+'">⋮</button></td></tr>'}).join('')+
    '</tbody></table></div>';
}

function applyPaymentToTarget(amount,targetId){
  const charge=data.charges.find(x=>x.id===targetId&&x.player===selectedPlayer().name);
  if(charge)charge.remaining=Math.max(0,Number(charge.remaining||0)-amount);
  if(charge&&/season tuition/i.test(charge.label)){
    let left=amount;
    unpaidInstallments().forEach(x=>{
      if(left<=0)return;
      const applied=Math.min(left,Number(x.amount||0));
      x.amount=Math.max(0,Number(x.amount||0)-applied);left-=applied;
      if(x.amount<0.01){x.amount=0;x.status='Paid'}
    });
  }
}
function reduceFutureSchedule(amount,effect){
  let left=Math.max(0,amount);const rows=unpaidInstallments();if(!rows.length)return;
  if(effect==='upcoming'){
    rows.forEach(x=>{if(left<=0)return;const d=Math.min(left,x.amount);x.amount-=d;left-=d;if(x.amount<0.01){x.amount=0;x.status='Paid'}});
  }else{
    const active=rows.filter(x=>x.amount>0);const each=active.length?left/active.length:0;
    active.forEach(x=>{x.amount=Math.max(0,x.amount-each);if(x.amount<0.01){x.amount=0;x.status='Paid'}});
  }
}
function regenerateSchedule(total,frequency,firstDate){
  const counts={'Monthly':4,'Semi-monthly':6,'Every two weeks':8,'Weekly':8},count=counts[frequency]||4;
  const per=Math.round((total/count)*100)/100,base=new Date((firstDate||'2026-11-01')+'T12:00:00');
  const oldIds=new Set(playerInstallments().filter(x=>x.status!=='Paid').map(x=>x.id));
  data.installments=data.installments.filter(x=>!oldIds.has(x.id));
  for(let i=0;i<count;i++){
    const d=new Date(base);d.setDate(d.getDate()+(frequency==='Monthly'?30*i:frequency==='Semi-monthly'?15*i:frequency==='Every two weeks'?14*i:7*i));
    const iso=d.toISOString().slice(0,10),amt=i===count-1?Math.round((total-per*(count-1))*100)/100:per;
    data.installments.push({id:'r'+Date.now()+i,date:iso,player:selectedPlayer().name,label:'Revised payment '+(i+1),amount:amt,status:'Scheduled'});
  }
}
function applyAdjustment(){
  const type=$('#fAdjustType').value,target=$('#fAdjustTarget').value,[kind,id]=target.split(':');
  const charge=kind==='charge'?data.charges.find(x=>x.id===id):null;
  if(['aid','discount','account-credit'].includes(type)){
    const amount=Math.max(0,Number($('#fAdjAmount').value||0));if(!amount)return toast('Enter an amount');
    const actual=charge?Math.min(amount,charge.remaining):Math.min(amount,playerBalance());
    if(charge)charge.remaining=Math.max(0,charge.remaining-actual);addPlayerBalance(-actual);reduceFutureSchedule(actual,$('#fScheduleEffect').value);
    const label=type==='aid'?'Financial aid credit':type==='discount'?'Discount':'Account credit applied';
    data.transactions.unshift({date:today,type:'Credit',desc:label,detail:'Billing adjustment',player:selectedPlayer().name,amount:-actual});toast(label+' applied');
  } else if(type==='correction'){
    const delta=Number($('#fAdjAmount').value||0);if(!delta)return toast('Enter a correction');
    if(charge)charge.remaining=Math.max(0,charge.remaining+delta);addPlayerBalance(delta);
    data.transactions.unshift({date:today,type:'Correction',desc:'Billing correction',detail:($('#fNote').value||'Staff correction'),player:selectedPlayer().name,amount:delta});toast('Correction applied');
  } else if(type==='remove'){
    if(charge)charge.status='Removal requested';data.adjustRequests.push({player:selectedPlayer().name,type:'Remove item',target,status:'Pending Finance approval',date:today});toast('Removal request sent to Finance');
  } else if(type==='reduce-payment'){
    const x=data.installments.find(v=>v.id===$('#fAdjInstallment').value),newAmt=Math.max(0,Number($('#fAdjAmount').value||0));if(!x)return;
    const diff=Math.max(0,x.amount-newAmt);x.amount=newAmt;if(newAmt===0)x.status='Scheduled';
    const later=unpaidInstallments().filter(v=>v.id!==x.id&&v.date>=x.date);
    if(diff&&later.length){if($('#fScheduleEffect').value==='next')later[0].amount+=diff;else{const each=diff/later.length;later.forEach(v=>v.amount+=each)}}
    toast('Payment schedule adjusted');
  } else if(type==='due-date'){
    const x=data.installments.find(v=>v.id===$('#fAdjInstallment').value);if(x)x.date=$('#fAdjDate').value;toast('Due date changed');
  } else if(type==='frequency'){
    regenerateSchedule(unpaidInstallments().reduce((s,x)=>s+x.amount,0),$('#fFrequency').value,nextPlayerInstallment()&&nextPlayerInstallment().date);toast('Unpaid schedule regenerated');
  } else if(type==='convert-plan'){
    const total=Math.max(0,Number($('#fAdjAmount').value||0));regenerateSchedule(total,$('#fFrequency').value,$('#fAdjDate').value);setPlayerBalance(total);toast('Converted to payment plan');
  }
}
function saveAction(){
  const a=action.type;
  if(a==='account'){
    data.name=$('#fName').value;data.phone=$('#fPhone').value;data.email=$('#fEmail').value;data.mailingAddress=$('#fMail').value;data.billingAddress=$('#fBill').value;toast('Fake account updated');
  } else if(a==='responsibility'){toast('Responsibility transfer simulated');}
  else if(a==='payment'){
    const amount=Math.max(0,Number($('#fAmount').value||0));if(!amount)return toast('Enter an amount');
    const target=$('#fPaymentTarget').value,method=$('#fMethod').selectedOptions[0].textContent;
    const actual=Math.min(amount,playerBalance());applyPaymentToTarget(actual,target);addPlayerBalance(-actual);
    if(selectedPlayer().name===data.players[0].name)data.pastDue=Math.max(0,Number(data.pastDue||0)-actual);
    data.transactions.unshift({date:today,type:'Payment',desc:'Staff recorded payment',detail:method,player:selectedPlayer().name,amount:-actual});toast('Payment recorded for '+selectedPlayer().name);
  } else if(a==='charge'){
    const amount=Math.max(0,Number($('#fAmount').value||0));if(!amount)return toast('Enter an amount');
    const desc=$('#fDesc').value,mode=$('#fCollection').value,player=selectedPlayer().name,id='c'+Date.now();
    data.charges.push({id,group:'Staff-added charges · '+player,label:desc,player,amount,remaining:amount,status:'Open'});addPlayerBalance(amount);
    data.transactions.unshift({date:today,type:'Charge',desc,detail:mode==='offline'?'Finance managed / offline':mode==='plan'?'Automatic installment plan':'One-time charge',player,amount});
    if(mode==='plan'){const per=Math.round((amount/3)*100)/100;for(let i=0;i<3;i++)data.installments.push({id:'p'+Date.now()+i,date:['2026-11-01','2026-12-01','2027-01-01'][i],player,label:desc+' · Payment '+(i+1),amount:i===2?Math.round((amount-per*2)*100)/100:per,status:'Scheduled'})}
    toast('Fake charge created');
  } else if(a==='adjustBilling'){applyAdjustment();}
  else if(a==='waiveFee'){
    const x=data.charges.find(v=>v.id===action.id);if(x){const amt=x.remaining;x.remaining=0;x.status='Waived';addPlayerBalance(-amt);data.transactions.unshift({date:today,type:'Credit',desc:'Fee waived',detail:x.label,player:selectedPlayer().name,amount:-amt});toast('Fee waived')}
  } else if(a==='method'){
    const type=$('#fType').value,label=$('#fLabel').value||'Demo method',last4=$('#fLast4').value||'0000';data.methods.push({id:'m'+Date.now(),type,label,last4,default:false,autopay:false});toast('Fake payment method added');
  } else if(a==='methodManage'){
    const choice=$('input[name="methodAction"]:checked');if(!choice)return toast('Choose an action');
    const id=action.id,m=data.methods.find(x=>x.id===id);
    if(choice.value==='default'){data.methods.forEach(x=>x.default=x.id===id);toast('Account default changed')}
    if(choice.value==='autopay'){data.autopayByPlayer[selectedPlayer().name]=id;toast(selectedPlayer().name+' autopay changed')}
    if(choice.value==='remove'){
      if(m.default||data.autopayByPlayer[selectedPlayer().name]===id)return toast('Change default/autopay before removing this method');
      data.methods=data.methods.filter(x=>x.id!==id);toast('Payment method removed')
    }
  } else if(a==='statement'){toast('Print simulated')}
  else if(a==='paymentRequest'){toast('Payment request sent')}
  else if(a==='refund'){
    const amount=Math.max(0,Number($('#fAmount').value||0));if(!amount)return toast('Enter a refund amount');
    addPlayerBalance(amount);data.transactions.unshift({date:today,type:'Refund',desc:'Refund created',detail:($('#fNote').value||'Processor refund'),player:selectedPlayer().name,amount});toast('Fake refund created');
  }
  closeDrawer();render();
}
function reconcile(){
  const amount=playerProcessing();if(!amount)return;
  const player=selectedPlayer().name,p=data.transactions.find(x=>x.type==='Processing'&&x.player===player),i=data.installments.find(x=>x.status==='Processing'&&x.player===player);
  if(p){p.type='Payment';p.desc='Card payment verified';p.detail='Authorize.Net · settled after reconciliation'}
  if(i){i.status='Paid';i.amount=0}
  data.processing=0;addPlayerBalance(-amount);data.notes.unshift({date:today,by:'System',scope:player,status:'Normal',text:'Authorize.Net confirmed the '+money(amount)+' payment. Billing activity and balance were repaired exactly once.'});
  render();toast('Processor result verified for '+player);
}
init();
</script>
