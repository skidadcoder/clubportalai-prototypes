<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClubPortalAI Tryouts Prototype</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--fg:#1f2933;--muted:#667085;--line:#e4e4e1;--brand:#f16432;--brand2:#d94f20;--soft:#fff8f5;--mutedbg:#f5f5f3;--good:#067647;--goodbg:#ecfdf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.bar{background:#fff7f2;border-bottom:1px solid #ffd7c7;color:#b54708;padding:8px;text-align:center;font-size:12px;font-weight:800}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 33px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px}.brand{font-weight:900;font-size:18px;padding:8px 8px 24px}.brand span{display:inline-grid;place-items:center;width:34px;height:30px;background:var(--brand);color:#fff;border-radius:4px;margin-right:8px;font-size:12px}.navlabel{font-size:10px;color:#98a2b3;text-transform:uppercase;letter-spacing:.12em;padding:14px 8px 6px}.nav{padding:10px 9px;border-radius:7px;color:#475467;margin:2px 0}.nav.active{background:#f7f1ed;box-shadow:inset 3px 0 0 var(--brand);font-weight:800;color:#1f2933}.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:800}.page{max-width:1450px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.head h1{font-size:30px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted)}.btn{border:1px solid #d9d9d6;background:#fff;border-radius:9px;padding:9px 13px;font-weight:800;color:#344054}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.card.active{border-color:var(--brand);background:var(--soft)}.title{font-size:17px;font-weight:900}.tiny{font-size:11px;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:800}.badge.good{background:var(--goodbg);color:var(--good)}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.steps{display:flex;margin-bottom:22px}.step{flex:1;text-align:center;font-size:11px;font-weight:800;color:#98a2b3;border-top:2px solid #e4e7ec;padding-top:9px}.step.active,.step.done{color:var(--brand);border-color:var(--brand)}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:900}.input{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:10px;background:#fff}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.choice{border:1px solid #d9d9d6;border-radius:12px;padding:14px;background:#fff}.choice.selected{border-color:var(--brand);background:var(--soft)}.session{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.session:last-child{border-bottom:0}.search-results{display:grid;gap:7px;max-height:250px;overflow:auto;margin-top:9px}.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:10px}.doc.selected{border-color:var(--brand);background:var(--soft)}.actions{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.seasonbar{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--brand);background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:18px}.seasonbar select{min-width:260px}
@media(max-width:850px){.app{display:block}.side{display:none}.cards,.two,.three{grid-template-columns:1fr}.page{padding:18px 14px}.seasonbar{align-items:stretch;flex-direction:column}.seasonbar select{min-width:0}.session{grid-template-columns:1fr}}
</style>
</head>
<body><div class="bar">PROTOTYPE ONLY · Synthetic data · Nothing here changes ClubPortalAI</div><div id="app"></div>
<script>
var state={screen:"list",step:1,season:"2026-2027 Club Season",draft:{name:"",description:"",gender:"Girls / Female",age:"14",asOf:"2027-07-01",capacity:72,opens:"2026-09-01T09:00",closes:"2026-11-07T20:00",programs:true,programMin:2,programMax:3,positions:true,positionMin:1,positionMax:2,offerHours:48,fee:65,docs:["liability","participant"],docSearch:""}};
var tryouts=[
{name:"2027 Girls 14U Tryouts",season:"2026-2027 Club Season",status:"Active",dates:"Nov 8–11",players:54,sessions:4},
{name:"2027 Girls 15U Tryouts",season:"2026-2027 Club Season",status:"Draft",dates:"Nov 15–17",players:0,sessions:3},
{name:"2027 Boys 16U Tryouts",season:"2026-2027 Club Season",status:"Active",dates:"Oct 25–27",players:38,sessions:3}
];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shell(content){return '<div class="app"><aside class="side"><div class="brand"><span>CP</span>ClubPortalAI</div><div class="navlabel">Season Planning</div><div class="nav">Teams & Rosters</div><div class="nav active">Tryouts</div><div class="nav">Season Tuition Plans</div><div class="navlabel">Operations</div><div class="nav">Events</div><div class="nav">Attendance</div></aside><div class="main"><div class="top"><div>Winter Park Volleyball Academy</div><div class="tiny">Staff/Admin · CA</div></div>'+content+'</div></div>'}
function render(){document.getElementById("app").innerHTML=shell(state.screen==="list"?listView():createView())}
function listView(){return '<main class="page"><div class="head"><div><h1>Tryouts</h1><div class="sub">Plan Tryouts, registration, Sessions, preferences, and Team Offer timing.</div></div><button class="btn primary" onclick="startCreate()">+ Create Tryout</button></div><div class="grid cards">'+tryouts.map(t=>'<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="title">'+esc(t.name)+'</div><div class="tiny">'+esc(t.season)+'</div></div><span class="badge '+(t.status==="Active"?"good":"")+'">'+t.status+'</span></div><div style="margin-top:14px"><div class="row"><span class="tiny">Dates</span><b>'+t.dates+'</b></div><div class="row"><span class="tiny">Sessions</span><b>'+t.sessions+'</b></div><div class="row"><span class="tiny">Players</span><b>'+t.players+'</b></div></div><div style="margin-top:14px;text-align:right"><button class="btn small">Open</button></div></div>').join("")+'</div></main>'}
function startCreate(){state.screen="create";state.step=1;render()}
function createView(){var labels=["Basics","Schedule","Registration","Pricing","Review"];return '<main class="page"><div class="head"><div><h1>Create Tryout</h1></div><button class="btn" onclick="state.screen=\'list\';render()">Exit setup</button></div><div class="form"><div class="steps">'+labels.map((l,i)=>'<div class="step '+(state.step===i+1?"active":state.step>i+1?"done":"")+'">'+l+'</div>').join("")+'</div><div class="seasonbar"><div><b>Tryout</b><div class="tiny">Season context applies throughout setup.</div></div><select class="input" onchange="state.season=this.value;render()"><option>2026-2027 Club Season</option><option>Summer 2027</option></select></div>'+stepBody()+'<div class="actions"><button class="btn" '+(state.step===1?'style="visibility:hidden"':'')+' onclick="state.step--;render()">Back</button>'+(state.step<5?'<button class="btn primary" onclick="state.step++;render()">Continue</button>':'<button class="btn primary" onclick="publishTryout()">Publish Tryout</button>')+'</div></div></main>'}
function stepBody(){if(state.step===1)return basics();if(state.step===2)return schedule();if(state.step===3)return registration();if(state.step===4)return pricing();return review()}
function basics(){var d=state.draft;return '<div class="grid" style="gap:20px"><div class="field"><label>Name</label><input class="input" style="font-size:16px" placeholder="2027 Girls 14U Tryouts" value="'+esc(d.name)+'" oninput="state.draft.name=this.value"></div><div class="field"><label>Parent description</label><textarea class="input" rows="3" placeholder="What should families know?" oninput="state.draft.description=this.value">'+esc(d.description)+'</textarea></div><div class="grid three"><div class="field"><label>Gender</label><select class="input"><option>Girls / Female</option><option>Boys / Male</option><option>Coed</option></select></div><div class="field"><label>No older than</label><input class="input" type="number" value="'+d.age+'"></div><div class="field"><label>As of</label><input class="input" type="date" value="'+d.asOf+'"></div></div></div>'}
function schedule(){return '<div><div class="sub">One Registration and fee can cover Regular, Callback, and Makeup Sessions.</div><div style="margin-top:12px">'+[
["Regular","Sun, Nov 8","4:00–6:00 PM","WPVC South Gym · Courts 1–4"],
["Regular","Mon, Nov 9","6:00–8:00 PM","WPVC North Gym · Courts A–C"],
["Callback","Tue, Nov 10","6:30–8:00 PM","WPVC South Gym · Court 1"],
["Makeup","Wed, Nov 11","6:00–7:30 PM","WPVC North Gym · Court A"]
].map((s,i)=>'<div class="session"><b>'+s[0]+'</b><div><b>'+s[1]+'</b><div class="tiny">'+s[2]+'</div></div><div class="tiny">'+s[3]+'</div><button class="btn small">Edit</button></div>').join("")+'</div><button class="btn small" style="margin-top:12px">+ Add Session</button></div>'}
function registration(){var d=state.draft;return '<div class="grid two"><div class="grid"><div class="card"><div class="title">Registration window</div><div class="grid two" style="margin-top:12px"><div class="field"><label>Opens</label><input class="input" type="datetime-local" value="'+d.opens+'"></div><div class="field"><label>Closes</label><input class="input" type="datetime-local" value="'+d.closes+'"></div></div></div><div class="card"><div class="title">Legal documents</div><div class="field" style="margin-top:10px"><input class="input" placeholder="Search waivers, agreements, consents..." oninput="state.draft.docSearch=this.value;render()"></div><div class="search-results">'+docs().filter(x=>!d.docSearch||x.name.toLowerCase().includes(d.docSearch.toLowerCase())).map(x=>'<div class="doc '+(d.docs.includes(x.id)?"selected":"")+'"><div><b>'+x.name+'</b><div class="tiny">'+x.meta+'</div></div><button class="btn small '+(d.docs.includes(x.id)?"primary":"")+'" onclick="toggleDoc(\''+x.id+'\')">'+(d.docs.includes(x.id)?"Attached":"Attach")+'</button></div>').join("")+'</div></div></div><div class="grid"><div class="card"><div class="title">Player preferences</div><label class="choice selected" style="display:block;margin-top:10px"><b>Team Program preferences</b><div class="tiny">Rank the programs the Player would consider.</div></label><div class="grid two" style="margin-top:8px"><div class="field"><label>Minimum required</label><input class="input" type="number" value="'+d.programMin+'"></div><div class="field"><label>Allow up to</label><input class="input" type="number" value="'+d.programMax+'"></div></div><label class="choice selected" style="display:block;margin-top:14px"><b>Positional preferences</b><div class="tiny">Rank preferred volleyball positions.</div></label><div class="grid two" style="margin-top:8px"><div class="field"><label>Minimum required</label><input class="input" type="number" value="'+d.positionMin+'"></div><div class="field"><label>Allow up to</label><input class="input" type="number" value="'+d.positionMax+'"></div></div></div><div class="card"><div class="title">Team Offer response</div><div class="field" style="margin-top:10px"><label>Default response window</label><div style="display:flex;gap:8px;align-items:center"><input class="input" style="width:100px" type="number" value="'+d.offerHours+'"><span class="tiny">hours</span></div><div class="tiny">Staff can extend an individual Offer later.</div></div></div></div></div>'}
function pricing(){return '<div class="grid two"><div class="card"><div class="title">Tryout fee</div><div class="grid two" style="margin-top:10px"><div class="field"><label>ACH</label><input class="input" value="$65"></div><div class="field"><label>Card</label><input class="input" value="$68"></div></div><div class="tiny" style="margin-top:8px">One Tryout Registration. One fee.</div></div><div class="card"><div class="title">Discounts</div><div class="row"><span>Current rostered Player</span><b>10%</b></div><div class="row"><span>Prior same-season Tryout</span><b>$10</b></div><button class="btn small" style="margin-top:10px">+ Add discount</button></div></div>'}
function review(){return '<div class="grid two"><div class="card"><div class="title">Tryout</div><div class="row"><span>Season</span><b>'+state.season+'</b></div><div class="row"><span>Sessions</span><b>4</b></div><div class="row"><span>Gender</span><b>Girls / Female</b></div><div class="row"><span>Age</span><b>No older than 14</b></div></div><div class="card"><div class="title">Registration</div><div class="row"><span>Team Program preferences</span><b>2 required · up to 3</b></div><div class="row"><span>Position preferences</span><b>1 required · up to 2</b></div><div class="row"><span>Offer response</span><b>48 hours</b></div><div class="row"><span>Fee</span><b>$65 ACH</b></div></div></div>'}
function docs(){return[{id:"liability",name:"Liability Waiver 2026-2027",meta:"Waiver · Published Aug 4"},{id:"participant",name:"Participant Agreement",meta:"Agreement · Published Aug 4"},{id:"media",name:"Photo & Media Consent",meta:"Consent · Published Aug 4"},{id:"medical",name:"Medical Treatment Authorization",meta:"Consent · Published Aug 9"},{id:"safety",name:"Concussion & Safety Acknowledgment",meta:"Acknowledgment · Published Aug 12"}]}
function toggleDoc(id){var a=state.draft.docs,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);render()}
function publishTryout(){tryouts.unshift({name:state.draft.name||"New Tryout",season:state.season,status:"Active",dates:"Upcoming",players:0,sessions:4});state.screen="list";state.step=1;render()}
render();
</script></body></html>
