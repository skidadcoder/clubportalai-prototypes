@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

 const months={};ev.forEach(e=>{const month=e.month||'October';(months[month]=months[month]||[]).push(e)});
 const conflictFor=e=>ev.filter(x=>x.day===e.day&&(x.month||'October')===(e.month||'October')).some(x=>x.aid!==e.aid);

 return '<div class="pad"><button class="back" data-act="back">'+ic('back','s')+'Schedule</button><div style="display:flex;gap:9px;align-items:center">'+pic(a,'a32')+'<span class="m" style="font-weight:600">'+a.name+'</span></div><div><h1 class="h1">'+e.title+'</h1></div><div class="card"><div class="row">'+ic('cal','m')+'<div class="grow"><div class="t">'+e.dow+', October '+e.day+'</div><div class="m">'+e.time+'</div></div></div><div class="row">'+ic('pin','m')+'<div class="grow"><div class="t">'+e.where+'</div><div class="m">100 Example Court, Winter Park, FL</div></div><button class="link" data-act="toast:Directions would open in Maps">Directions</button></div></div><button class="btn pri full" data-act="toast:Added to your calendar">Add to calendar</button></div>';}

const PROTOTYPE_THEME_KEY = 'clubportalai-prototype-theme';
function applyPrototypeTheme(theme){
  const next = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(PROTOTYPE_THEME_KEY, next); } catch (e) {}
  const light = document.getElementById('proto-theme-light');
  const dark = document.getElementById('proto-theme-dark');
  if (light) light.setAttribute('aria-pressed', (next === 'light').toString());
  if (dark) dark.setAttribute('aria-pressed', (next === 'dark').toString());
}
let initialTheme='light';try{initialTheme=localStorage.getItem(PROTOTYPE_THEME_KEY)||'light'}catch(e){}
applyPrototypeTheme(initialTheme);
document.getElementById('proto-theme-light').addEventListener('click', () => applyPrototypeTheme('light'));
document.getElementById('proto-theme-dark').addEventListener('click', () => applyPrototypeTheme('dark'));

function benjiPayOutcome(amount){
 const before=S.benjiInstallments.slice(), after=before.slice(); let left=amount;
 for(let i=0;i<after.length&&left>0;i++){const use=Math.min(after[i],left);after[i]-=use;left-=use;}
 const months=['Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul'],paid=[],reduced=[];
 before.forEach((b,i)=>{if(b<=0)return;if(after[i]===0)paid.push({mon:months[i],day:1});else if(after[i]<b)reduced.push({mon:months[i],day:1,before:b,after:after[i]});});
 const ni=after.findIndex(x=>x>0); const next=ni>=0?{mon:months[ni],day:1,amt:after[ni]}:null;

let eventPress = null;
const EVENT_PRESS_CANCEL_DISTANCE = 10;
function clearEventPress(){
  if (!eventPress) return;
  eventPress.card.classList.remove('is-pressed');
  eventPress = null;
}
screen.addEventListener('pointerdown', e => {
  const row = e.target.closest('.eventrow');
  if (!row || !screen.contains(row)) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const card = row.closest('.eventcard');
  if (!card) return;
  clearEventPress();
  eventPress = { pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, card };
  card.classList.add('is-pressed');
});
screen.addEventListener('pointermove', e => {
  if (!eventPress || e.pointerId !== eventPress.pointerId) return;
  const dx = e.clientX - eventPress.startX;
  const dy = e.clientY - eventPress.startY;
  if (Math.hypot(dx, dy) > EVENT_PRESS_CANCEL_DISTANCE) clearEventPress();
});
screen.addEventListener('pointerup', e => {
  if (eventPress && e.pointerId === eventPress.pointerId) clearEventPress();
});
screen.addEventListener('pointercancel', clearEventPress);
screen.addEventListener('lostpointercapture', clearEventPress);
window.addEventListener('blur', clearEventPress);

});
