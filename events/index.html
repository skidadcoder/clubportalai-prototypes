function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function initials(n){return String(n).split(" ").map(function(x){return x[0]}).join("").slice(0,2).toUpperCase()}
function badge(text,type){return '<span class="badge '+(type||"")+'">'+esc(text)+'</span>'}
function currentEvent(){return events.find(function(e){return e.id===state.eventId})||events[0]}
function eventSessions(id){return sessions.filter(function(s){return s.eventId===id})}
function eventRegs(id){return registrations.filter(function(r){return r.eventId===id})}
function toast(msg){state.toast=msg;renderToast();setTimeout(function(){state.toast=null;renderToast()},2200)}
function renderToast(){document.getElementById("toast").innerHTML=state.toast?'<div class="toast">'+esc(state.toast)+'</div>':""}
function setPersona(p){state.persona=p;state.modal=null;if(p==="staff")state.screen="list";if(p==="participant")resetSignup(false);if(p==="coach")state.screen="coach";if(p==="volunteer")state.screen="volunteer";render()}
function shell(content,active){
 var nav='<aside class="sidebar"><div class="brand"><div class="brandmark">CP</div>ClubPortalAI</div><div class="nav-label">Club</div>'+
 '<div class="nav-item"><span class="dot"></span>Dashboard</div><div class="nav-item"><span class="dot"></span>Accounts</div><div class="nav-label">Operations</div>'+
 '<div class="nav-item '+(active==="events"?"active":"")+'"><span class="dot"></span>Events</div><div class="nav-item"><span class="dot"></span>Attendance</div><div class="nav-item"><span class="dot"></span>Communications</div>'+
 '<div class="nav-label">Season planning</div><div class="nav-item"><span class="dot"></span>Teams & Rosters</div><div class="nav-item"><span class="dot"></span>Tryouts</div></aside>';
 var top='<div class="main"><div class="topbar"><div class="org">Winter Park Volleyball Academy</div><div class="top-actions"><div class="persona">'+
 personaButton("staff","Staff")+personaButton("participant","Participant")+personaButton("coach","Coach")+personaButton("volunteer","Volunteer")+
 '</div><div class="avatar">CA</div></div></div>'+content+'<div class="mobile-nav"><button class="'+(active==="events"?"active":"")+'" onclick="state.screen=\'list\';render()">Events</button><button onclick="state.eventTab=\'attendance\';openEvent(\'clinic\')">Attendance</button><button onclick="setPersona(\'coach\')">Coach</button><button onclick="setPersona(\'volunteer\')">Volunteer</button></div></div>';
 return '<div class="app">'+nav+top+'</div>'
}
function personaButton(p,label){return '<button class="'+(state.persona===p?"active":"")+'" onclick="setPersona(\''+p+'\')">'+label+'</button>'}

function listView(){
 var filtered=events.filter(function(e){var matches=state.statusFilter==="All"||e.status===state.statusFilter;var q=state.search.toLowerCase();return matches&&(!q||e.name.toLowerCase().indexOf(q)>=0||e.kind.toLowerCase().indexOf(q)>=0)});
 var body=state.listView==="cards"?'<div class="grid cards">'+filtered.map(eventCard).join("")+'</div>':eventTable(filtered);
 return '<main class="page"><div class="page-head"><div><div class="eyebrow">Operations</div><h1>Events</h1><div class="sub">Create signup activities, manage Sessions, registrations, attendance, coaches, volunteers, and the changes people already committed to.</div></div><div class="actions"><button class="btn primary" onclick="startWizard()">+ Create Event</button></div></div>'+
 '<div class="grid stats"><div class="stat"><div class="label">Active events</div><div class="value">3</div><div class="hint">1 has staff attention</div></div><div class="stat"><div class="label">Upcoming Sessions</div><div class="value">10</div><div class="hint">Next: Tue 5:00 PM</div></div><div class="stat"><div class="label">Registrations</div><div class="value">53</div><div class="hint">Across active Events</div></div><div class="stat"><div class="label">Needs attention</div><div class="value">3</div><div class="hint">Coverage, cancellation, email</div></div></div>'+
 '<div class="toolbar"><div class="toolbar-left"><input class="control search" placeholder="Search Events" value="'+esc(state.search)+'" oninput="state.search=this.value;render()"><select class="control" onchange="state.statusFilter=this.value;render()"><option '+(state.statusFilter==="All"?"selected":"")+'>All</option><option '+(state.statusFilter==="Active"?"selected":"")+'>Active</option><option '+(state.statusFilter==="Draft"?"selected":"")+'>Draft</option></select></div><div class="toolbar-right"><div class="seg"><button class="'+(state.listView==="cards"?"active":"")+'" onclick="state.listView=\'cards\';render()">Cards</button><button class="'+(state.listView==="table"?"active":"")+'" onclick="state.listView=\'table\';render()">List</button></div></div></div>'+body+'</main>'
}
function eventCard(e){
 return '<article class="event-card"><div class="event-accent '+e.accent+'"></div><div class="event-body"><div class="event-top"><div><div class="event-title">'+esc(e.name)+'</div><div class="meta">'+esc(e.kind)+' · '+esc(e.audience)+'</div></div>'+badge(e.status,statusType(e.status))+'</div>'+
 '<div class="event-facts"><div class="fact"><b>'+esc(e.date)+'</b><span>'+e.sessions+' Session'+(e.sessions===1?"":"s")+'</span></div><div class="fact"><b>'+esc(e.location)+'</b><span>'+e.registered+' registered</span></div><div class="fact"><b>'+esc(e.price)+'</b><span>Published signup</span></div><div class="fact"><b>'+e.capacity+' per Session</b><span>Participant limit</span></div></div>'+
 (e.attention?'<div class="attention"><div class="icon">!</div><div><b>'+e.attention+' items need attention</b><span>Open the Event workspace to resolve them.</span></div></div>':"")+
 '</div><div class="card-footer"><span class="tiny">'+(e.status==="Draft"?"Not visible to families":"Visible to eligible people")+'</span><button class="btn small" onclick="openEvent(\''+e.id+'\')">'+(e.status==="Draft"?"Continue setup":"Open")+'</button></div></article>'
}
function eventTable(list){
 return '<div class="table-wrap"><table class="table"><thead><tr><th>Event</th><th>Status</th><th>Schedule</th><th>Registrations</th><th>Price</th><th></th></tr></thead><tbody>'+list.map(function(e){return '<tr><td><div class="strong">'+esc(e.name)+'</div><div class="tiny">'+esc(e.kind)+' · '+esc(e.location)+'</div></td><td>'+badge(e.status,statusType(e.status))+'</td><td>'+esc(e.date)+'<div class="tiny">'+e.sessions+' Session'+(e.sessions===1?"":"s")+'</div></td><td>'+e.registered+(e.attention?' '+badge(e.attention+" attention","warn"):"")+'</td><td>'+esc(e.price)+'</td><td><button class="btn small" onclick="openEvent(\''+e.id+'\')">Open</button></td></tr>'}).join("")+'</tbody></table></div>'

 '<div class="tabs">'+tabs.map(function(t){return '<button class="tab '+(state.eventTab===t?"active":"")+'" onclick="state.eventTab=\''+t+'\';render()">'+({overview:"Overview",sessions:"Sessions",registrations:"Registrations",attendance:"Attendance",staff:"Staff & Volunteers",changes:"Changes & notices"}[t])+'</button>'}).join("")+'</div></div>'+workspaceTab(e)+'</main>'
}

}
function overviewTab(e){
 var rs=eventRegs(e.id), ss=eventSessions(e.id);
 return '<div class="grid two"><div class="grid"><section class="panel"><h2>At a glance</h2><div class="grid three"><div class="stat"><div class="label">Registrations</div><div class="value">'+rs.length+'</div><div class="hint">'+rs.filter(function(r){return r.payment==="Past due"}).length+' past due</div></div><div class="stat"><div class="label">Next Session</div><div class="value" style="font-size:18px">'+(ss[0]?ss[0].date:"None")+'</div><div class="hint">'+(ss[0]?ss[0].time:"")+'</div></div><div class="stat"><div class="label">Capacity</div><div class="value">'+e.capacity+'</div><div class="hint">Per Session</div></div></div></section>'+
 '<section class="panel"><h2>Signup</h2><div class="row"><div class="k">Audience</div><div class="v">'+esc(e.audience)+'</div></div><div class="row"><div class="k">Options</div><div class="v">'+(e.id==="meeting"?"One-session RSVP":"Full Event or selected Sessions")+'</div></div><div class="row"><div class="k">Published prices</div><div class="v">'+esc(e.price)+'</div></div><div class="row"><div class="k">Late full-Event signup</div><div class="v">Current published price · no automatic proration</div></div><div class="row"><div class="k">Cancellation</div><div class="v">Allowed through Oct 5 · 11:59 PM</div></div></section>'+
 '<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Upcoming Sessions</h2><button class="btn small" onclick="state.eventTab=\'sessions\';render()">Manage</button></div><div class="session-list">'+ss.slice(0,4).map(sessionRow).join("")+'</div></section></div>'+
 '<aside class="grid"><section class="panel"><h2>Needs attention</h2><div class="attention"><div class="icon">↻</div><div><b>Coach coverage needed</b><span>Oct 8 · Megan Lee requested coverage.</span></div></div><div class="attention bad"><div class="icon">!</div><div><b>Cancellation request</b><span>Ava Kim · future collection is paused.</span></div></div><div class="attention blue"><div class="icon">✉</div><div><b>1 email failed</b><span>Schedule change notice can be resent.</span></div></div></section>'+
 '<section class="panel"><h2>Money stays with Registrations</h2><div class="sub">Event setup publishes prices and payment choices. Staff handle exceptions, holds, cancellations, and Billing Changes from the affected Registration instead of running a second finance system here.</div><div style="margin-top:12px"><button class="btn small" onclick="state.eventTab=\'registrations\';render()">View Registrations</button></div></section></aside></div>'
}
function sessionRow(s){

}
function sessionsTab(e){
 var ss=eventSessions(e.id);return '<div class="page-head" style="margin-bottom:12px"><div><h1 style="font-size:19px">Sessions</h1><div class="sub">Each Session owns its date, time, place, capacity usage, Attendance roll call, and any named-court reservation.</div></div><div class="actions"><button class="btn" onclick="showConflictDemo()">Court conflict demo</button><button class="btn primary" onclick="addSession()">+ Add Session</button></div></div>'+
 '<div class="session-list">'+ss.map(sessionRow).join("")+'</div><div class="attention blue" style="margin-top:12px"><div class="icon">i</div><div><b>Parallel Session rule</b><span>Oct 13 has two simultaneous venue options. A Participant can be assigned to only one of them; capacity and Attendance follow that assignment.</span></div></div>'
}
function registrationsTab(e){
 var rs=eventRegs(e.id);return '<div class="page-head" style="margin-bottom:12px"><div><h1 style="font-size:19px">Registrations</h1><div class="sub">One Registration per Participant for this Event. Coverage may be the whole Event or selected Sessions.</div></div><div class="actions"><button class="btn primary" onclick="startAssisted()">+ Staff-assisted registration</button></div></div>'+
 '<div class="table-wrap"><table class="table"><thead><tr><th>Participant</th><th>Registrant</th><th>Coverage</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>'+rs.map(function(r){return '<tr><td><div class="person"><div class="mini-avatar">'+initials(r.participant)+'</div><div><div class="strong">'+esc(r.participant)+'</div><div class="tiny">'+esc(r.price)+' · '+esc(r.rail)+'</div></div></div></td><td>'+esc(r.registrant)+'</td><td>'+esc(r.coverage)+'</td><td>'+badge(r.payment,r.payment==="Past due"?"bad":r.payment==="Processing"?"warn":r.payment==="Paid"?"good":"")+'</td><td>'+badge(r.status,r.cancel?"warn":"")+(r.hold?' '+badge("Participation hold","bad"):"")+'</td><td><button class="btn small" onclick="registrationDetail(\''+r.id+'\')">Open</button></td></tr>'}).join("")+'</tbody></table></div>'

function ageRuleSummaryText(d){
 if(d.ageRule==="none")return "No restriction";
 if(d.ageRule==="min")return "No younger than "+d.minAge+" as of "+d.ageAsOf;
 if(d.ageRule==="max")return "No older than "+d.maxAge+" as of "+d.ageAsOf;
 return "Ages "+d.minAge+"–"+d.maxAge+" as of "+d.ageAsOf
}
function wizardActions(){
 return '<div class="wizard-actions"><button class="btn" '+(state.wizardStep===1?'style="visibility:hidden"':"")+' onclick="state.wizardStep--;render()">Back</button>'+(state.wizardStep<5?'<button class="btn primary" onclick="nextWizard()">Continue</button>':'<button class="btn primary" onclick="publishDraft()">Publish Event</button>')+'</div>'
}
function nextWizard(){if(state.wizardStep===1&&!state.draft.name.trim()){state.draft.name="Winter Skills Clinic";toast("Added a sample name so you can keep moving")};state.wizardStep++;render()}
function publishDraft(){
 var d=state.draft,id="new"+Date.now(),p=generatedPreview(d),locs=[];
 p.forEach(function(x){if(locs.indexOf(x.location)<0)locs.push(x.location)});
 events.push({id:id,name:d.name||"Winter Skills Clinic",kind:d.kind,status:"Active",accent:d.isTryout?"violet":"green",date:p.length===1?p[0].date:p[0].date+" + "+(p.length-1)+" more",location:locs.length>1?"Multiple locations":locs[0],sessions:p.length,registered:0,capacity:d.capacity,price:d.free?"Free":d.isTryout?"$"+d.achFull+" tryout fee":"$"+d.achFull+" full · $"+d.achDrop+"/day",audience:d.audience,attention:0});
 p.forEach(function(x,i){sessions.push({id:id+"s"+i,eventId:id,date:x.date,time:x.time,location:x.location,court:x.courts,registered:0,cap:d.capacity,status:"Scheduled",label:d.isTryout?(i===p.length-1?"Makeup":"Regular"):undefined})});

}
function launchSignup(){resetSignup(false);state.persona="participant";state.screen="signup";render()}
function resetSignup(assisted){

}
function signupView(){
 var e=currentEvent();var s=state.signup;var body="";
 if(s.stage==="email")body=signupEmail(e,s);
 else if(s.stage==="code")body=signupCode(e,s);
 else if(s.stage==="participant")body=signupParticipant(e,s);
 else if(s.stage==="tryout-details")body=signupTryoutDetails(e,s);
 else if(s.stage==="sessions")body=signupSessions(e,s);
 else if(s.stage==="payment")body=signupPayment(e,s);

}

function calcPrice(){
 var s=state.signup,e=currentEvent();
 if(e.id==="meeting")return {base:0,discount:0,deposit:0,total:0};
 if(e.kind==="Tryout"){var b=s.rail==="ach"?65:68;return {base:b,discount:10,deposit:0,total:Math.max(0,b-10)}}
 var count=Math.max(1,s.selected.length),base=s.coverage==="full"?(s.rail==="ach"?325:340):count*(s.rail==="ach"?70:74),discount=s.coverage==="full"?25:10*count,deposit=s.coverage==="full"?50:0;
 return {base:base,discount:discount,deposit:deposit,total:Math.max(0,base-discount)+deposit}
}

 (!tryout&&s.coverage==="full"?'<div class="radio-cards" style="grid-template-columns:1fr 1fr;margin-top:10px"><div class="radio-card '+(s.plan==="full"?"selected":"")+'" onclick="state.signup.plan=\'full\';render()"><b>Pay in full</b><span>Event Price + Deposit today.</span></div><div class="radio-card '+(s.plan==="installments"?"selected":"")+'" onclick="state.signup.plan=\'installments\';render()"><b>Installments</b><span>Deposit today, then the one configured Event schedule.</span></div></div>':"")+
 '<div class="price-box"><div class="summary-line"><span>Published '+(tryout?"Tryout fee":"Event Price")+'</span><b>$'+p.base.toFixed(2)+'</b></div><div class="summary-line"><span>'+(tryout?"Prior same-season Tryout":"Current Player")+' discount</span><b>-$'+p.discount.toFixed(2)+'</b></div>'+(p.deposit?'<div class="summary-line"><span>Deposit</span><b>$'+p.deposit.toFixed(2)+'</b></div>':'')+'<div class="summary-line total"><span>'+(!tryout&&s.plan==="installments"&&s.coverage==="full"?"Due today":"Total due today")+'</span><span>$'+(!tryout&&s.plan==="installments"&&s.coverage==="full"?p.deposit.toFixed(2):p.total.toFixed(2))+'</span></div></div>'+

}

function confirmCancelEvent(){state.modal={title:"Cancel this Event?",body:'<div class="sub">This cancels every future Session, stops signup, preserves history, pauses affected future collection, and starts notice and finance follow-up. A canceled Event cannot be reopened.</div>',actions:'<button class="btn" onclick="closeModal()">Keep Event</button><button class="btn danger" onclick="cancelEvent()">Cancel Event</button>'};renderModal()}
function cancelEvent(){currentEvent().status="Canceled";eventSessions(currentEvent().id).forEach(function(s){s.status="Canceled"});closeModal();toast("Event canceled in prototype");render()}
function sessionMenu(id){var s=sessions.find(function(x){return x.id===id});state.modal={title:"Manage "+s.date,body:'<div class="row"><div class="k">Time</div><div class="v">'+esc(s.time)+'</div></div><div class="row"><div class="k">Location</div><div class="v">'+esc(s.location)+'</div></div><div class="row"><div class="k">Court</div><div class="v">'+esc(s.court)+'</div></div><div class="attention blue"><div class="icon">i</div><div><b>Moving this Session preserves its identity and registrations.</b><span>If Attendance activity existed, this would be a recorded correction instead of a normal schedule edit.</span></div></div>',actions:'<button class="btn" onclick="closeModal()">Done</button><button class="btn" onclick="toast(\'Edit Session simulated\');closeModal()">Edit</button><button class="btn danger" onclick="cancelSession(\''+id+'\')">Cancel Session</button>'};renderModal()}
function cancelSession(id){var s=sessions.find(function(x){return x.id===id});s.status="Canceled";closeModal();toast("Session canceled; replacement would be a new Session");render()}
function addSession(){toast("Future Session added; full-Event Registrants would be included and notified")}
function showConflictDemo(){state.modal={title:"Court reservation conflict",body:'<div class="attention"><div class="icon">!</div><div><b>Court 1 is already reserved</b><span>Tue, Oct 20 · 5:30 - 7:00 PM · 15 Armour Practice · WPVC South Gym.</span></div></div><div class="sub">A shared-court overlap requires explicit acknowledgment. A same-facility overlap without the same named court is advisory only.</div>',actions:'<button class="btn" onclick="closeModal()">Change court</button><button class="btn primary" onclick="toast(\'Conflict acknowledged in prototype\');closeModal()">Acknowledge & save</button>'};renderModal()}
function registrationDetail(id){var r=registrations.find(function(x){return x.id===id});state.modal={title:r.participant+" · Registration",body:'<div class="row"><div class="k">Registrant / Payer</div><div class="v">'+esc(r.registrant)+'</div></div><div class="row"><div class="k">Coverage</div><div class="v">'+esc(r.coverage)+'</div></div><div class="row"><div class="k">Agreed Event Price</div><div class="v">'+esc(r.price)+'</div></div><div class="row"><div class="k">Payment</div><div class="v">'+esc(r.payment)+' · '+esc(r.rail)+'</div></div><div class="row"><div class="k">Participation</div><div class="v">'+(r.hold?badge("Event-only hold","bad"):badge("Allowed","good"))+'</div></div>'+(r.cancel?'<div class="attention bad"><div class="icon">!</div><div><b>Cancellation requested</b><span>Future automatic collection is paused. The seat stays until staff completes cancellation.</span></div></div>':'')+'<div class="attention blue"><div class="icon">$</div><div><b>Staff price exceptions happen during signup</b><span>A Staff Admin can offer a lower final Event Price for one Registration. After confirmation, reductions use Billing Changes and preserve the original agreement.</span></div></div>',actions:'<button class="btn" onclick="closeModal()">Done</button><button class="btn" onclick="toggleHold(\''+id+'\')">'+(r.hold?"Lift hold":"Place Event hold")+'</button><button class="btn primary" onclick="toast(\'Registration change started in prototype\');closeModal()">Change Registration</button>'};renderModal()}
function toggleHold(id){var r=registrations.find(function(x){return x.id===id});r.hold=!r.hold;closeModal();toast(r.hold?"Event participation hold placed":"Participation hold lifted");render()}
function markAttendance(sid,name,mark){if(!attendance[sid])attendance[sid]={};attendance[sid][name]=mark;render()}
function resolveCoverage(){state.coverageRequested=false;toast("Aaron Blake assigned as replacement for Oct 8");render()}
function addOpportunity(){toast("Simple volunteer opportunity added in prototype")}
function requestCoverage(){state.coverageRequested=true;toast("Coverage request sent to staff dashboard");render()}
function toggleCoachClock(){state.coachClocked=!state.coachClocked;toast(state.coachClocked?"Clocked in with server timestamp":"Clocked out");render()}
function previousClockDemo(){state.modal={title:"Finish previous work first",body:'<div class="sub">You still have an open clock from Fall Skills Clinic. Enter the actual end time for that work period, then ClubPortalAI can start a new clock here. The current time is not silently substituted.</div><div class="field" style="margin-top:12px"><label>Actual end time</label><input class="input" type="time" value="19:10"></div>',actions:'<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="toast(\'Previous time corrected; new clock started\');closeModal()">Finish previous & Clock In here</button>'};renderModal()}
function claimVolunteer(id){var v=volunteers.find(function(x){return x.id===id});if(id==="v2"&&state.volunteerClaims.indexOf("v1")>=0){toast("This overlaps another volunteer commitment");return}state.volunteerClaims.push(id);v.claimed++;toast("Volunteer commitment confirmed");render()}
function releaseVolunteer(id){var v=volunteers.find(function(x){return x.id===id});state.volunteerClaims=state.volunteerClaims.filter(function(x){return x!==id});v.claimed=Math.max(0,v.claimed-1);toast("Volunteer commitment released");render()}
function toggleVolClock(){state.volClocked=!state.volClocked;toast(state.volClocked?"Volunteer clock started":"Volunteer clock stopped");render()}
function closeModal(){state.modal=null;renderModal()}
function renderModal(){var root=document.getElementById("modal");if(!root)return;if(!state.modal){root.innerHTML="";return}root.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>'+esc(state.modal.title)+'</h2><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">'+state.modal.body+'</div><div class="modal-foot">'+state.modal.actions+'</div></div></div>'}
render();
</script>
</body>
</html>
