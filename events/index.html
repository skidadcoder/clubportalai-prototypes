function addSession(){toast("Future Session added; full-Event Registrants would be included and notified")}
function showConflictDemo(){state.modal={title:"Court reservation conflict",body:'<div class="attention"><div class="icon">!</div><div><b>Court 1 is already reserved</b><span>Tue, Oct 20 · 5:30 - 7:00 PM · 15 Armour Practice · WPVC South Gym.</span></div></div><div class="sub">A shared-court overlap requires explicit acknowledgment. A same-facility overlap without the same named court is advisory only.</div>',actions:'<button class="btn" onclick="closeModal()">Change court</button><button class="btn primary" onclick="toast(\'Conflict acknowledged in prototype\');closeModal()">Acknowledge & save</button>'};renderModal()}
function registrationDetail(id){var r=registrations.find(function(x){return x.id===id});state.modal={title:r.participant+" · Registration",body:'<div class="row"><div class="k">Registrant / Payer</div><div class="v">'+esc(r.registrant)+'</div></div><div class="row"><div class="k">Coverage</div><div class="v">'+esc(r.coverage)+'</div></div><div class="row"><div class="k">Agreed Event Price</div><div class="v">'+esc(r.price)+'</div></div><div class="row"><div class="k">Payment</div><div class="v">'+esc(r.payment)+' · '+esc(r.rail)+'</div></div><div class="row"><div class="k">Participation</div><div class="v">'+(r.hold?badge("Event-only hold","bad"):badge("Allowed","good"))+'</div></div>'+(r.cancel?'<div class="attention bad"><div class="icon">!</div><div><b>Cancellation requested</b><span>Future automatic collection is paused. The seat stays until staff completes cancellation.</span></div></div>':'')+'<div class="attention blue"><div class="icon">$</div><div><b>Staff price exceptions happen during signup</b><span>A Staff Admin can offer a lower final Event Price for one Registration. After confirmation, reductions use Billing Changes and preserve the original agreement.</span></div></div>',actions:'<button class="btn" onclick="closeModal()">Done</button><button class="btn" onclick="toggleHold(\''+id+'\')">'+(r.hold?"Lift hold":"Place Event hold")+'</button><button class="btn primary" onclick="toast(\'Registration change started in prototype\');closeModal()">Change Registration</button>'};renderModal()}
function toggleHold(id){var r=registrations.find(function(x){return x.id===id});r.hold=!r.hold;closeModal();toast(r.hold?"Event participation hold placed":"Participation hold lifted");render()}
function markAttendance(sid,name,mark){if(!attendance[sid])attendance[sid]={};attendance[sid][name]=mark;render()}
function resolveCoverage(){state.coverageRequested=false;toast("Aaron Blake assigned as replacement for Oct 8");render()}
function addOpportunity(){toast("Simple volunteer opportunity added in prototype")}
function requestCoverage(){state.coverageRequested=true;toast("Coverage request sent to staff dashboard");render()}
function toggleCoachClock(){state.coachClocked=!state.coachClocked;toast(state.coachClocked?"Clocked in with server timestamp":"Clocked out");render()}
function previousClockDemo(){state.modal={title:"Finish previous work first",body:'<div class="sub">You still have an open clock from Fall Skills Clinic. Enter the actual end time for that work period, then ClubPortalAI can start a new clock here. The current time is not silently substituted.</div><div class="field" style="margin-top:12px"><label>Actual end time</label><input class="input" type="time" value="19:10"></div>',actions:'<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="toast(\'Previous time corrected; new clock started\');closeModal()">Finish previous & Clock In here</button>'};renderModal()}
function claimVolunteer(id){var v=volunteers.find(function(x){return x.id===id});if(id==="v2"&&state.volunteerClaims.indexOf("v1")>=0){toast("This overlaps another volunteer commitment");return}state.volunteerClaims.push(id);v.claimed++;toast("Volunteer commitment confirmed");render()}
function releaseVolunteer(id){var v=volunteers.find(function(x){return x.id===id});state.volunteerClaims=state.volunteerClaims.filter(function(x){return x!==id});v.claimed=Math.max(0,v.claimed-1);toast("Volunteer commitment released");render()}
function toggleVolClock(){state.volClocked=!state.volClocked;toast(state.volClocked?"Volunteer clock started":"Volunteer clock stopped");render()}
function closeModal(){state.modal=null;renderModal()}
function renderModal(){var root=document.getElementById("modal");if(!root)return;if(!state.modal){root.innerHTML="";return}root.innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>'+esc(state.modal.title)+'</h2><button class="x" onclick="closeModal()">×</button></div><div class="modal-body">'+state.modal.body+'</div><div class="modal-foot">'+state.modal.actions+'</div></div></div>'}
render();
</script>
</body>
</html>
